name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\H2LinuxMultiTerminal.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish .\H2LinuxMultiTerminal.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: H2LinuxMultiTerminal-win-x64
          path: .\publish\H2LinuxMultiTerminal.exe
          if-no-files-found: error
